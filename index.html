<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5b8c">
<title>読書管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#2b2b2b; --sub:#7c7468;
    --accent:#3b5b8c; --accent-ink:#fff; --line:#e6e1d8;
    --want:#caa45a; --reading:#4d9a8f; --done:#3b5b8c;
    --danger:#c05a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:10;background:var(--accent);color:var(--accent-ink);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  header .menu{display:flex;gap:8px}
  header button{
    background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;
    padding:7px 10px;font-size:13px;cursor:pointer;
  }
  main{max-width:680px;margin:0 auto;padding:14px 14px 90px}

  /* タブ */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{
    flex:1;border:none;background:var(--card);color:var(--sub);
    padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);
  }
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .panel{display:none}
  .panel.active{display:block}

  /* 検索 */
  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .searchbar input{
    flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;
  }
  .btn{
    border:none;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap;
  }
  .btn.scan{background:#2f7d6f}
  .hint{font-size:12px;color:var(--sub);margin:0 2px 12px}

  /* 書影カード */
  .book{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:10px;
  }
  .cover{
    width:56px;height:80px;flex:0 0 56px;border-radius:5px;object-fit:cover;
    background:#e9e4da;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--sub);text-align:center;overflow:hidden;
  }
  .book .info{flex:1;min-width:0}
  .book .title{font-size:15px;font-weight:700;margin:0 0 3px;line-height:1.35}
  .book .author{font-size:12.5px;color:var(--sub);margin:0 0 2px}
  .book .pub{font-size:11.5px;color:var(--sub);margin:0}
  .book .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{
    border:none;border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .pill.want{background:#f5ead0;color:#8a6d28}
  .pill.reading{background:#d8efe9;color:#2c6b61}
  .pill.done{background:#dde6f3;color:#2d477a}

  /* 本棚操作 */
  .shelf-tools{margin-bottom:12px}
  .shelf-tools .row{display:flex;gap:8px;margin-bottom:8px}
  .shelf-tools input.search{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;
  }
  .shelf-tools select{
    border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:13px;background:#fff;
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{
    border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;
    padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tagfilter{margin:10px 0 0;font-size:13px;color:var(--sub);display:none;align-items:center;gap:8px}
  .tagfilter.on{display:flex}
  .tagfilter .clear{border:none;background:var(--accent);color:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}

  .status-tag{
    display:inline-block;font-size:11px;font-weight:700;border-radius:5px;
    padding:2px 7px;margin-bottom:4px;color:#fff;
  }
  .status-tag.want{background:var(--want)}
  .status-tag.reading{background:var(--reading)}
  .status-tag.done{background:var(--done)}
  .stars{font-size:15px;letter-spacing:1px;color:#d9b94b;cursor:pointer;margin-top:4px}
  .stars span{opacity:.3}
  .stars span.on{opacity:1}

  /* タグ */
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{
    background:#eee7da;color:#6b5d3e;border:none;border-radius:14px;padding:3px 10px;
    font-size:11.5px;cursor:pointer;font-weight:600;
  }
  .tag .x{margin-left:5px;opacity:.55}
  .tag.add{background:#fff;border:1px dashed var(--line);color:var(--sub)}

  /* 進捗バー */
  .progress{margin-top:8px}
  .progress .bar{height:7px;background:#e9e4da;border-radius:4px;overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--reading);border-radius:4px}
  .progress .lbl{font-size:11.5px;color:var(--sub);margin-top:3px}

  .note{
    width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;
    padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:38px;background:#fff;
  }

  details.rec{margin-top:8px}
  details.rec summary{font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;list-style:none}
  details.rec summary::-webkit-details-marker{display:none}
  details.rec summary::before{content:"▸ ";font-size:10px}
  details.rec[open] summary::before{content:"▾ "}
  .rec-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;margin-top:8px;font-size:13px}
  .rec-grid label{color:var(--sub);font-size:12.5px}
  .rec-grid input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;background:#fff;width:100%}
  .rec-grid .pages{display:flex;align-items:center;gap:6px}
  .rec-grid .pages input{width:70px}

  .row-actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .mini{font-size:12px;border:none;background:none;cursor:pointer;color:var(--sub);padding:4px}
  .mini.del{color:var(--danger)}
  select.status-select{
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;
  }

  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px;line-height:1.7}
  .loading{text-align:center;color:var(--sub);padding:24px;font-size:14px}

  /* 統計タブ */
  .stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;color:var(--accent)}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}
  .card-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card-box h3{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .card-box h3 select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;background:#fff}
  .chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:6px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .chart .col .v{font-size:11px;color:var(--sub);margin-bottom:2px;height:14px}
  .chart .col .b{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .chart .col .m{font-size:10px;color:var(--sub);margin-top:4px}
  .goal{margin-top:4px}
  .goal .bar{height:12px;background:#e9e4da;border-radius:6px;overflow:hidden}
  .goal .bar i{display:block;height:100%;background:var(--done);border-radius:6px}
  .goal .row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
  .goal input{width:60px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px}

  /* スキャナモーダル */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  }
  .modal.open{display:flex}
  #reader{width:100%;max-width:420px;border-radius:12px;overflow:hidden;background:#000}
  .modal .cap{color:#fff;margin:14px 0;font-size:14px;text-align:center}
  .modal .close{margin-top:8px;background:#fff;color:#222;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#2b2b2b;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;
    z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📚 読書管理</h1>
  <div class="menu">
    <button id="exportBtn">書き出し</button>
    <button id="importBtn">読み込み</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="active" data-tab="shelf">本棚</button>
    <button data-tab="stats">記録</button>
    <button data-tab="add">追加</button>
  </div>

  <!-- 本棚 -->
  <section class="panel active" id="panel-shelf">
    <div class="shelf-tools">
      <div class="row">
        <input class="search" id="shelfSearch" type="search" placeholder="タイトル・著者・タグで絞り込み">
        <select id="sortSel">
          <option value="added">追加が新しい順</option>
          <option value="rating">評価が高い順</option>
          <option value="finished">読了日が新しい順</option>
          <option value="title">タイトル順</option>
        </select>
      </div>
      <div class="filters" id="filters">
        <button data-f="all" class="active">すべて</button>
        <button data-f="want">読みたい</button>
        <button data-f="reading">読書中</button>
        <button data-f="done">読了</button>
      </div>
      <div class="tagfilter" id="tagFilter">
        <span>タグ：<b id="tagFilterName"></b></span>
        <button class="clear" id="tagClear">解除</button>
      </div>
    </div>
    <div id="shelfList"></div>
  </section>

  <!-- 記録（統計） -->
  <section class="panel" id="panel-stats">
    <div class="stats" id="statCards"></div>
    <div class="card-box">
      <h3>年間読書目標</h3>
      <div class="goal" id="goalBox"></div>
    </div>
    <div class="card-box">
      <h3>月別の読了冊数 <select id="yearSel"></select></h3>
      <div class="chart" id="chart"></div>
    </div>
  </section>

  <!-- 追加 -->
  <section class="panel" id="panel-add">
    <button class="btn scan" id="scanBtn" style="width:100%;margin-bottom:10px">📷 バーコード（ISBN）をスキャン</button>
    <div class="searchbar">
      <input id="q" type="search" placeholder="タイトル・著者・ISBNで検索" enterkeyhint="search">
      <button class="btn" id="searchBtn">検索</button>
    </div>
    <p class="hint">例：「夜は短し」「村上春樹」「9784101010014」など</p>
    <div id="results"></div>
  </section>
</main>

<!-- スキャナ -->
<div class="modal" id="scanModal">
  <div id="reader"></div>
  <div class="cap" id="scanCap">本の裏のバーコード（978…）を枠に合わせてください</div>
  <button class="close" id="closeScan">閉じる</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ============ データ層 ============ */
const KEY = 'book-tracker-v1';
const GOAL_KEY = 'book-tracker-goal';
let books = load();
let goal = parseInt(localStorage.getItem(GOAL_KEY) || '0', 10) || 0;

function load(){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ arr = []; }
  // 旧データに新フィールドを補完（マイグレーション）
  return arr.map(b => ({
    tags: [], startedAt: null, finishedAt: b.finishedAt || null,
    currentPage: 0, totalPages: b.totalPages || 0,
    ...b,
    tags: Array.isArray(b.tags) ? b.tags : []
  }));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(books)); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============ 書籍検索API ============ */
async function lookupISBN(isbn){
  isbn = isbn.replace(/[^0-9Xx]/g,'');
  try{
    const r = await fetch('https://api.openbd.jp/v1/get?isbn=' + isbn);
    const d = await r.json();
    if(d && d[0] && d[0].summary){
      const s = d[0].summary;
      let cover = s.cover || '';
      let totalPages = 0;
      // openBDは書影が無いことが多いので、無ければGoogle Booksから書影・ページ数を補完
      if(!cover){
        try{
          const g = await searchGoogle('isbn:' + isbn);
          if(g[0]){ cover = g[0].cover || ''; totalPages = g[0].totalPages || 0; }
        }catch(e){}
      }
      return {
        id: 'isbn:'+isbn, title: s.title || '(タイトル不明)',
        authors: cleanAuthor(s.author), publisher: s.publisher || '',
        published: s.pubdate || '', cover, isbn, totalPages
      };
    }
  }catch(e){}
  const g = await searchGoogle('isbn:' + isbn);
  return g[0] || null;
}

// openBDの著者欄は「夏目,漱石,1867-1916／著」のような生データなので読みやすく整える
function cleanAuthor(a){
  if(!a) return '';
  return a
    .replace(/\d{3,4}-\d{0,4}/g, '')
    .replace(/／[^／,、]*/g, '')
    .replace(/[,，]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/[、･・]\s*$/,'')
    .trim();
}

// 国立国会図書館サーチ（CORS対応・キー不要）。Google Booksが使えない時の保険。
// まずタイトルで検索し、0件なら著者名として再検索する。
async function searchNDL(query){
  let out = await ndlQuery('title', query);
  if(!out.length) out = await ndlQuery('creator', query);   // 著者名で入力された場合の保険
  // 並べ替え：日本のISBN優先 ＋ タイトル一致度（完全 > 前方 > 部分）
  const score = (b)=>{
    const t = b.title || '';
    let s = isJpIsbn(b.isbn) ? 2 : 0;
    if(t === query) s += 4;
    else if(t.startsWith(query)) s += 2;
    else if(t.includes(query)) s += 1;
    return s;
  };
  out.sort((a,b)=> score(b) - score(a));
  return out;
}

async function ndlQuery(field, query){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 10000);
  let txt = '';
  try{
    // dpid=iss-ndl-opac で蔵書目録に限定（雑誌記事などのノイズを源流から除外）。
    // cnt=20以上は共有IPだとスロットルされやすいので10に抑える。
    const r = await fetch('https://ndlsearch.ndl.go.jp/api/opensearch?dpid=iss-ndl-opac&cnt=10&' + field + '=' + encodeURIComponent(query), {signal:ctrl.signal});
    txt = await r.text();
  } finally { clearTimeout(to); }

  const items = txt.split('<item>').slice(1).map(s=> s.slice(0, s.indexOf('</item>')));
  const pick = (x, tag) => { const m = x.match(new RegExp('<'+tag+'>([\\s\\S]*?)<\\/'+tag+'>')); return m ? unescapeXML(m[1].trim()) : ''; };
  const out = [];
  const seen = new Set();
  items.forEach(x=>{
    if(!/<category>図書<\/category>/.test(x)) return;           // 図書だけ（記事・録音資料などを除外）
    const isbnRaw = (x.match(/dcndl:ISBN">([\dXx-]+)</)||[])[1];
    const isbn = isbnRaw ? isbnRaw.replace(/[^0-9Xx]/g,'') : '';
    if(!isbn) return;
    if(seen.has(isbn)) return;
    seen.add(isbn);
    const creators = (x.match(/<dc:creator>([\s\S]*?)<\/dc:creator>/g)||[]).map(c=>unescapeXML(c.replace(/<\/?dc:creator>/g,'')));
    out.push({
      id: 'isbn:'+isbn,
      title: pick(x,'dc:title') || '(タイトル不明)',
      authors: cleanAuthor(creators.join('、')),
      publisher: pick(x,'dc:publisher'),
      published: pick(x,'dcterms:issued') || (x.match(/<pubDate>([\s\S]*?)<\/pubDate>/)||[])[1] || '',
      cover: '', isbn, totalPages: 0
    });
  });
  return out;
}
function isJpIsbn(i){ return /^9784/.test(i) || /^4/.test(i); }
function unescapeXML(s){ return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'").replace(/&amp;/g,'&'); }

async function searchGoogle(query){
  const url = 'https://www.googleapis.com/books/v1/volumes?country=JP&maxResults=20&q=' + encodeURIComponent(query);
  const r = await fetch(url);
  const d = await r.json();
  if(!d.items) return [];
  return d.items.map(it=>{
    const v = it.volumeInfo || {};
    const ids = v.industryIdentifiers || [];
    const isbn = (ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10')||{}).identifier || '';
    let cover = (v.imageLinks && (v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)) || '';
    cover = cover.replace('http://','https://');
    return {
      id: isbn ? 'isbn:'+isbn : 'g:'+it.id,
      title: v.title || '(タイトル不明)',
      authors: (v.authors||[]).join('、'),
      publisher: v.publisher || '',
      published: v.publishedDate || '',
      cover, isbn, totalPages: v.pageCount || 0
    };
  });
}

/* ============ 検索UI ============ */
const resultsEl = document.getElementById('results');
document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  resultsEl.innerHTML = '<div class="loading">検索中…</div>';
  try{
    let items;
    if(/^[0-9]{10}([0-9]{3})?$/.test(q.replace(/-/g,''))){
      const b = await lookupISBN(q);
      items = b ? [b] : [];
    }else{
      // まずGoogle Books（並び順が優秀）。0件や429のときは国会図書館サーチで補う。
      try{ items = await searchGoogle(q); }catch(e){ items = []; }
      if(!items.length){
        try{ items = await searchNDL(q); }catch(e){ items = []; }
      }
    }
    if(!items.length){ resultsEl.innerHTML = '<div class="empty">見つかりませんでした。別のキーワードでお試しください。</div>'; return; }
    resultsEl.innerHTML = items.map(b=>resultCard(b)).join('');
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">通信エラーが発生しました。<br>電波の良い場所で再度お試しください。</div>';
  }
}

// ISBN13(978…) を ISBN10 に変換（Amazonの書影URLはISBN10指定のため）
function toIsbn10(isbn){
  const s = String(isbn||'').replace(/[^0-9Xx]/g,'');
  if(s.length === 10) return s;
  if(s.length === 13 && s.startsWith('978')){
    const core = s.slice(3,12);
    let sum = 0;
    for(let i=0;i<9;i++) sum += (10-i) * parseInt(core[i],10);
    const c = (11 - (sum % 11)) % 11;
    return core + (c === 10 ? 'X' : c);
  }
  return null;
}
// 書影は単一ソースだと欠けやすいので、複数ソースを順に試す（前のが失敗なら次へ）
// 日本語書籍はAmazonの書影CDNが最もヒットするので主に、次いでOpenLibrary。
function coverCandidates(b){
  const list = [];
  if(b.cover) list.push(b.cover);
  const i10 = toIsbn10(b.isbn);
  if(i10) list.push('https://images-na.ssl-images-amazon.com/images/P/' + i10 + '.01.LZZZZZZZ.jpg');
  const isbn = String(b.isbn||'').replace(/[^0-9Xx]/g,'');
  if(isbn) list.push('https://covers.openlibrary.org/b/isbn/' + isbn + '-M.jpg?default=false');
  return list;
}
function coverHTML(b){
  const c = coverCandidates(b);
  if(!c.length) return `<div class="cover">No<br>Image</div>`;
  const fb = encodeURIComponent(JSON.stringify(c.slice(1)));
  return `<img class="cover" src="${esc(c[0])}" data-fb="${fb}" alt="" onload="coverLoad(this)" onerror="coverErr(this)">`;
}
// Amazonは書影が無いと1×1の空画像を返すので、極小サイズは「失敗」とみなして次へ送る
window.coverLoad = function(img){
  if(img.naturalWidth > 1) return;
  coverErr(img);
};
window.coverErr = function(img){
  let fb = [];
  try{ fb = JSON.parse(decodeURIComponent(img.dataset.fb || '%5B%5D')); }catch(e){}
  if(fb.length){ const next = fb.shift(); img.dataset.fb = encodeURIComponent(JSON.stringify(fb)); img.src = next; }
  else img.replaceWith(noCover());
};
function noCover(){ const d=document.createElement('div'); d.className='cover'; d.innerHTML='No<br>Image'; return d; }

function resultCard(b){
  const enc = encodeURIComponent(JSON.stringify(b));
  return `<div class="book">
    ${coverHTML(b)}
    <div class="info">
      <p class="title">${esc(b.title)}</p>
      ${b.authors? `<p class="author">${esc(b.authors)}</p>`:''}
      ${b.publisher||b.published? `<p class="pub">${esc(b.publisher)}${b.published? ' / '+esc(b.published):''}</p>`:''}
      <div class="actions">
        <button class="pill want"    onclick='addBook("${enc}","want")'>＋ 読みたい</button>
        <button class="pill reading" onclick='addBook("${enc}","reading")'>＋ 読書中</button>
        <button class="pill done"    onclick='addBook("${enc}","done")'>＋ 読了</button>
      </div>
    </div>
  </div>`;
}

const today = () => new Date().toISOString().slice(0,10);

window.addBook = function(enc, status){
  const b = JSON.parse(decodeURIComponent(enc));
  if(books.some(x=>x.id===b.id)){ toast('すでに本棚にあります'); switchTab('shelf'); return; }
  books.unshift({
    ...b, status, rating:0, note:'', tags:[],
    totalPages: b.totalPages || 0, currentPage: 0,
    addedAt: Date.now(),
    startedAt: (status==='reading'||status==='done') ? today() : null,
    finishedAt: status==='done' ? today() : null
  });
  save(); renderShelf();
  toast(status==='done'?'読了に追加しました 🎉':'本棚に追加しました');
  switchTab('shelf');
};

/* ============ 本棚UI ============ */
let filter = 'all';
let tagFilter = null;
let sortBy = 'added';
let searchText = '';
const shelfList = document.getElementById('shelfList');

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  filter = btn.dataset.f;
  [...document.querySelectorAll('#filters button')].forEach(b=>b.classList.toggle('active', b===btn));
  renderShelf();
});
document.getElementById('sortSel').addEventListener('change', e=>{ sortBy = e.target.value; renderShelf(); });
document.getElementById('shelfSearch').addEventListener('input', e=>{ searchText = e.target.value.trim().toLowerCase(); renderShelf(); });
document.getElementById('tagClear').onclick = ()=>{ tagFilter = null; renderShelf(); };
window.setTagFilter = (t)=>{ tagFilter = t; document.getElementById('shelfSearch').value=''; searchText=''; renderShelf(); switchTab('shelf'); };

const STATUS_LABEL = {want:'読みたい', reading:'読書中', done:'読了'};

function sortBooks(list){
  const a = [...list];
  if(sortBy==='rating') a.sort((x,y)=> (y.rating||0)-(x.rating||0) || y.addedAt-x.addedAt);
  else if(sortBy==='finished') a.sort((x,y)=> (y.finishedAt||'').localeCompare(x.finishedAt||'') || y.addedAt-x.addedAt);
  else if(sortBy==='title') a.sort((x,y)=> (x.title||'').localeCompare(y.title||'','ja'));
  else a.sort((x,y)=> y.addedAt-x.addedAt);
  return a;
}

function renderShelf(){
  // タグフィルタ表示
  const tf = document.getElementById('tagFilter');
  tf.classList.toggle('on', !!tagFilter);
  if(tagFilter) document.getElementById('tagFilterName').textContent = tagFilter;

  let list = books.filter(b=> filter==='all' || b.status===filter);
  if(tagFilter) list = list.filter(b=> (b.tags||[]).includes(tagFilter));
  if(searchText) list = list.filter(b=>{
    const hay = [b.title, b.authors, (b.tags||[]).join(' '), b.note].join(' ').toLowerCase();
    return hay.includes(searchText);
  });
  list = sortBooks(list);

  if(!list.length){
    shelfList.innerHTML = `<div class="empty">${books.length? '条件に合う本はありません。':'まだ本がありません。<br>「追加」タブから登録してみましょう。'}</div>`;
    return;
  }
  shelfList.innerHTML = list.map(bookCard).join('');
}

function bookCard(b){
  const stars = [1,2,3,4,5].map(n=>`<span class="${n<=b.rating?'on':''}" onclick='setRating("${b.id}",${n})'>★</span>`).join('');
  const tags = (b.tags||[]).map(t=>
    `<button class="tag" onclick='setTagFilter(${JSON.stringify(t)})'>${esc(t)}<span class="x" onclick='event.stopPropagation();removeTag("${b.id}",${JSON.stringify(t)})'>×</span></button>`
  ).join('');
  const pct = b.totalPages>0 ? Math.min(100, Math.round((b.currentPage/b.totalPages)*100)) : 0;
  const progress = b.status==='reading' ? `
    <div class="progress">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="lbl">${b.currentPage||0} / ${b.totalPages||'?'} ページ${b.totalPages>0? '（'+pct+'%）':''}</div>
    </div>` : '';

  return `<div class="book">
    ${coverHTML(b)}
    <div class="info">
      <span class="status-tag ${b.status}">${STATUS_LABEL[b.status]}</span>
      <p class="title">${esc(b.title)}</p>
      ${b.authors? `<p class="author">${esc(b.authors)}</p>`:''}
      <div class="stars">${stars}</div>
      ${progress}
      <div class="tags">
        ${tags}
        <button class="tag add" onclick='addTag("${b.id}")'>＋タグ</button>
      </div>
      <details class="rec">
        <summary>読書記録</summary>
        <div class="rec-grid">
          <label>読み始め</label>
          <input type="date" value="${b.startedAt||''}" onchange='setField("${b.id}","startedAt",this.value)'>
          <label>読了日</label>
          <input type="date" value="${b.finishedAt||''}" onchange='setField("${b.id}","finishedAt",this.value)'>
          <label>ページ</label>
          <div class="pages">
            <input type="number" min="0" value="${b.currentPage||''}" placeholder="現在" onchange='setNum("${b.id}","currentPage",this.value)'>
            <span>/</span>
            <input type="number" min="0" value="${b.totalPages||''}" placeholder="総数" onchange='setNum("${b.id}","totalPages",this.value)'>
          </div>
        </div>
        <textarea class="note" placeholder="メモ・感想…" onchange='setField("${b.id}","note",this.value)'>${esc(b.note||'')}</textarea>
      </details>
      <div class="row-actions">
        <select class="status-select" onchange='setStatus("${b.id}", this.value)'>
          <option value="want" ${b.status==='want'?'selected':''}>読みたい</option>
          <option value="reading" ${b.status==='reading'?'selected':''}>読書中</option>
          <option value="done" ${b.status==='done'?'selected':''}>読了</option>
        </select>
        <button class="mini del" onclick='delBook("${b.id}")'>削除</button>
      </div>
    </div>
  </div>`;
}

window.setStatus = (id, st)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  b.status = st;
  if(st==='reading' && !b.startedAt) b.startedAt = today();
  if(st==='done'){ if(!b.startedAt) b.startedAt = today(); if(!b.finishedAt) b.finishedAt = today(); }
  save(); renderShelf();
};
window.setRating = (id, n)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  b.rating = (b.rating===n)? 0 : n; save(); renderShelf();
};
window.setField = (id, f, v)=>{ const b=books.find(x=>x.id===id); if(b){ b[f]=v; save(); if(f==='finishedAt') renderShelf(); } };
window.setNum   = (id, f, v)=>{ const b=books.find(x=>x.id===id); if(b){ b[f]=parseInt(v,10)||0; save(); renderShelf(); } };
window.addTag = (id)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  const t = (prompt('タグを入力（例：小説、ビジネス、お気に入り）')||'').trim();
  if(!t) return;
  if(!b.tags.includes(t)) b.tags.push(t);
  save(); renderShelf();
};
window.removeTag = (id, t)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  b.tags = b.tags.filter(x=>x!==t); save(); renderShelf();
};
window.delBook = (id)=>{
  if(!confirm('この本を本棚から削除しますか？')) return;
  books = books.filter(x=>x.id!==id); save(); renderShelf(); toast('削除しました');
};

/* ============ 記録（統計）UI ============ */
function renderStats(){
  const done = books.filter(b=>b.status==='done');
  const pages = done.reduce((s,b)=> s + (b.totalPages||0), 0);
  const rated = books.filter(b=>b.rating>0);
  const avg = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) : '–';
  const thisYear = new Date().getFullYear();
  const thisYearCount = done.filter(b=> (b.finishedAt||'').slice(0,4)===String(thisYear)).length;

  document.getElementById('statCards').innerHTML = `
    <div class="stat"><div class="n">${done.length}</div><div class="l">読了（累計）</div></div>
    <div class="stat"><div class="n">${thisYearCount}</div><div class="l">今年の読了</div></div>
    <div class="stat"><div class="n">${pages.toLocaleString()}</div><div class="l">読了ページ数</div></div>
    <div class="stat"><div class="n">${avg}</div><div class="l">平均評価</div></div>`;

  // 年間目標
  const gpct = goal>0 ? Math.min(100, Math.round(thisYearCount/goal*100)) : 0;
  document.getElementById('goalBox').innerHTML = `
    <div class="row">
      <span>${thisYear}年の目標：</span>
      <input type="number" min="0" value="${goal||''}" placeholder="0" id="goalInput"> 冊
      <span style="color:var(--sub)">（達成 ${thisYearCount} 冊）</span>
    </div>
    ${goal>0? `<div class="bar"><i style="width:${gpct}%"></i></div>
      <div class="lbl" style="font-size:12px;color:var(--sub);margin-top:4px">${gpct}% 達成${thisYearCount>=goal?' 🎉':''}</div>`:''}`;
  document.getElementById('goalInput').onchange = (e)=>{
    goal = parseInt(e.target.value,10)||0; localStorage.setItem(GOAL_KEY, goal); renderStats();
  };

  // 年セレクタ
  const years = [...new Set(done.map(b=>(b.finishedAt||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!years.length) years.push(String(thisYear));
  const ySel = document.getElementById('yearSel');
  const cur = ySel.value && years.includes(ySel.value) ? ySel.value : years[0];
  ySel.innerHTML = years.map(y=>`<option value="${y}" ${y===cur?'selected':''}>${y}年</option>`).join('');
  ySel.onchange = renderChart;
  renderChart();
}

function renderChart(){
  const y = document.getElementById('yearSel').value;
  const counts = new Array(12).fill(0);
  books.filter(b=>b.status==='done' && (b.finishedAt||'').slice(0,4)===y)
       .forEach(b=>{ const m = parseInt((b.finishedAt||'').slice(5,7),10); if(m>=1&&m<=12) counts[m-1]++; });
  const max = Math.max(1, ...counts);
  document.getElementById('chart').innerHTML = counts.map((c,i)=>`
    <div class="col">
      <div class="v">${c||''}</div>
      <div class="b" style="height:${c/max*100}%"></div>
      <div class="m">${i+1}</div>
    </div>`).join('');
}

/* ============ タブ ============ */
function switchTab(name){
  [...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  ['shelf','stats','add'].forEach(p=>document.getElementById('panel-'+p).classList.toggle('active', p===name));
  if(name==='stats') renderStats();
}
document.querySelector('.tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(btn) switchTab(btn.dataset.tab);
});

/* ============ バーコードスキャン ============ */
let scanner = null;
const scanModal = document.getElementById('scanModal');
document.getElementById('scanBtn').onclick = startScan;
document.getElementById('closeScan').onclick = stopScan;

async function startScan(){
  scanModal.classList.add('open');
  document.getElementById('scanCap').textContent = 'カメラを起動しています…';
  scanner = new Html5Qrcode('reader', { formatsToSupport:[ Html5QrcodeSupportedFormats.EAN_13 ] });
  try{
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{width:260, height:160} }, onScan, ()=>{});
    document.getElementById('scanCap').textContent = '本の裏のバーコード（978…）を枠に合わせてください';
  }catch(e){
    document.getElementById('scanCap').textContent = 'カメラを使用できませんでした。権限を許可するか、検索をご利用ください。';
  }
}

let scanLock = false;
async function onScan(text){
  if(scanLock) return;
  if(!/^97[89]/.test(text)) return;
  scanLock = true;
  document.getElementById('scanCap').textContent = '読み取りました：' + text + ' / 検索中…';
  await stopScan();
  switchTab('add');
  document.getElementById('q').value = text;
  resultsEl.innerHTML = '<div class="loading">書籍情報を取得中…</div>';
  try{
    const b = await lookupISBN(text);
    resultsEl.innerHTML = b ? resultCard(b)
      : '<div class="empty">この本の情報が見つかりませんでした。タイトルで検索してみてください。</div>';
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">通信エラーが発生しました。</div>';
  }
  setTimeout(()=>scanLock=false, 800);
}

async function stopScan(){
  scanModal.classList.remove('open');
  if(scanner){ try{ await scanner.stop(); scanner.clear(); }catch(e){} scanner = null; }
}

/* ============ バックアップ ============ */
document.getElementById('exportBtn').onclick = ()=>{
  const payload = { books, goal };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'books-' + today() + '.json';
  a.click();
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const arr = Array.isArray(data) ? data : data.books;   // 旧形式(配列)も新形式({books,goal})も受ける
      if(!Array.isArray(arr)) throw 0;
      const ids = new Set(books.map(b=>b.id));
      let added = 0;
      arr.forEach(b=>{ if(b.id && !ids.has(b.id)){ books.push(b); ids.add(b.id); added++; } });
      if(!Array.isArray(data) && data.goal && !goal){ goal = data.goal; localStorage.setItem(GOAL_KEY, goal); }
      save();
      books = load();      // 取り込んだ本に新フィールドを補完して正規化
      renderShelf();
      toast(added + '冊を読み込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  r.readAsText(file);
};

/* ============ ユーティリティ ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

renderShelf();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
