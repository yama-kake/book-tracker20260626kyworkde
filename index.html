<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5b8c">
<title>ブクログ風 読書管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#2b2b2b; --sub:#7c7468;
    --accent:#3b5b8c; --accent-ink:#fff; --line:#e6e1d8;
    --want:#caa45a; --reading:#4d9a8f; --done:#3b5b8c;
    --danger:#c05a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:10;background:var(--accent);color:var(--accent-ink);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  header .menu{display:flex;gap:8px}
  header button{
    background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;
    padding:7px 10px;font-size:13px;cursor:pointer;
  }
  main{max-width:680px;margin:0 auto;padding:14px 14px 90px}

  /* タブ */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{
    flex:1;border:none;background:var(--card);color:var(--sub);
    padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);
  }
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .panel{display:none}
  .panel.active{display:block}

  /* 検索 */
  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .searchbar input{
    flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;
  }
  .btn{
    border:none;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap;
  }
  .btn.scan{background:#2f7d6f}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .hint{font-size:12px;color:var(--sub);margin:0 2px 12px}

  /* 書影カード */
  .book{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:10px;
  }
  .cover{
    width:56px;height:80px;flex:0 0 56px;border-radius:5px;object-fit:cover;
    background:#e9e4da;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--sub);text-align:center;overflow:hidden;
  }
  .book .info{flex:1;min-width:0}
  .book .title{font-size:15px;font-weight:700;margin:0 0 3px;line-height:1.35}
  .book .author{font-size:12.5px;color:var(--sub);margin:0 0 2px}
  .book .pub{font-size:11.5px;color:var(--sub);margin:0}
  .book .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{
    border:none;border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .pill.want{background:#f5ead0;color:#8a6d28}
  .pill.reading{background:#d8efe9;color:#2c6b61}
  .pill.done{background:#dde6f3;color:#2d477a}

  /* 本棚 */
  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filters button{
    border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;
    padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .status-tag{
    display:inline-block;font-size:11px;font-weight:700;border-radius:5px;
    padding:2px 7px;margin-bottom:4px;color:#fff;
  }
  .status-tag.want{background:var(--want)}
  .status-tag.reading{background:var(--reading)}
  .status-tag.done{background:var(--done)}
  .stars{font-size:15px;letter-spacing:1px;color:#d9b94b;cursor:pointer;margin-top:4px}
  .stars span{opacity:.3}
  .stars span.on{opacity:1}
  .note{
    width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;
    padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:38px;background:#fff;
  }
  .row-actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .mini{font-size:12px;border:none;background:none;cursor:pointer;color:var(--sub);padding:4px}
  .mini.del{color:var(--danger)}
  select.status-select{
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;
  }

  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px;line-height:1.7}
  .loading{text-align:center;color:var(--sub);padding:24px;font-size:14px}

  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;color:var(--accent)}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}

  /* スキャナモーダル */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  }
  .modal.open{display:flex}
  #reader{width:100%;max-width:420px;border-radius:12px;overflow:hidden;background:#000}
  .modal .cap{color:#fff;margin:14px 0;font-size:14px;text-align:center}
  .modal .close{margin-top:8px;background:#fff;color:#222;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#2b2b2b;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;
    z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📚 読書管理</h1>
  <div class="menu">
    <button id="exportBtn">書き出し</button>
    <button id="importBtn">読み込み</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="active" data-tab="shelf">本棚</button>
    <button data-tab="add">本を追加</button>
  </div>

  <!-- 本棚 -->
  <section class="panel active" id="panel-shelf">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button data-f="all" class="active">すべて</button>
      <button data-f="want">読みたい</button>
      <button data-f="reading">読書中</button>
      <button data-f="done">読了</button>
    </div>
    <div id="shelfList"></div>
  </section>

  <!-- 追加 -->
  <section class="panel" id="panel-add">
    <button class="btn scan" id="scanBtn" style="width:100%;margin-bottom:10px">📷 バーコード（ISBN）をスキャン</button>
    <div class="searchbar">
      <input id="q" type="search" placeholder="タイトル・著者・ISBNで検索" enterkeyhint="search">
      <button class="btn" id="searchBtn">検索</button>
    </div>
    <p class="hint">例：「夜は短し」「村上春樹」「9784101010014」など</p>
    <div id="results"></div>
  </section>
</main>

<!-- スキャナ -->
<div class="modal" id="scanModal">
  <div id="reader"></div>
  <div class="cap" id="scanCap">本の裏のバーコード（978…）を枠に合わせてください</div>
  <button class="close" id="closeScan">閉じる</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ============ データ層 ============ */
const KEY = 'book-tracker-v1';
let books = load();

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ return []; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(books)); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============ 書籍検索API ============ */
// ISBN → openBD（日本の本に強い）→ なければGoogle Books
async function lookupISBN(isbn){
  isbn = isbn.replace(/[^0-9Xx]/g,'');
  try{
    const r = await fetch('https://api.openbd.jp/v1/get?isbn=' + isbn);
    const d = await r.json();
    if(d && d[0] && d[0].summary){
      const s = d[0].summary;
      return {
        id: 'isbn:'+isbn, title: s.title || '(タイトル不明)',
        authors: cleanAuthor(s.author), publisher: s.publisher || '',
        published: s.pubdate || '', cover: s.cover || '', isbn
      };
    }
  }catch(e){}
  // フォールバック
  const g = await searchGoogle('isbn:' + isbn);
  return g[0] || null;
}

// openBDの著者欄は「夏目,漱石,1867-1916／著」のような生データなので読みやすく整える
function cleanAuthor(a){
  if(!a) return '';
  return a
    .replace(/\d{3,4}-\d{0,4}/g, '')      // 生没年を除去
    .replace(/／[^／,、]*/g, '')            // ／著 ／訳 などの役割表記を除去
    .replace(/[,，]/g, '')                  // 姓名区切りのカンマを除去
    .replace(/\s+/g, ' ')
    .replace(/[、･・]\s*$/,'')
    .trim();
}

async function searchGoogle(query){
  const url = 'https://www.googleapis.com/books/v1/volumes?country=JP&maxResults=20&q=' + encodeURIComponent(query);
  const r = await fetch(url);
  const d = await r.json();
  if(!d.items) return [];
  return d.items.map(it=>{
    const v = it.volumeInfo || {};
    const ids = v.industryIdentifiers || [];
    const isbn = (ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10')||{}).identifier || '';
    let cover = (v.imageLinks && (v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)) || '';
    cover = cover.replace('http://','https://');
    return {
      id: isbn ? 'isbn:'+isbn : 'g:'+it.id,
      title: v.title || '(タイトル不明)',
      authors: (v.authors||[]).join('、'),
      publisher: v.publisher || '',
      published: v.publishedDate || '',
      cover, isbn
    };
  });
}

/* ============ 検索UI ============ */
const resultsEl = document.getElementById('results');

document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  resultsEl.innerHTML = '<div class="loading">検索中…</div>';
  try{
    let items;
    if(/^[0-9]{10}([0-9]{3})?$/.test(q.replace(/-/g,''))){
      const b = await lookupISBN(q);
      items = b ? [b] : [];
    }else{
      items = await searchGoogle(q);
    }
    if(!items.length){ resultsEl.innerHTML = '<div class="empty">見つかりませんでした。別のキーワードでお試しください。</div>'; return; }
    resultsEl.innerHTML = items.map(b=>cardHTML(b, true)).join('');
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">通信エラーが発生しました。<br>電波の良い場所で再度お試しください。</div>';
  }
}

function coverHTML(b){
  if(b.cover) return `<img class="cover" src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.replaceWith(noCover())">`;
  return `<div class="cover">No<br>Image</div>`;
}
function noCover(){ const d=document.createElement('div'); d.className='cover'; d.innerHTML='No<br>Image'; return d; }

function cardHTML(b, isResult){
  const enc = encodeURIComponent(JSON.stringify(b));
  return `<div class="book">
    ${coverHTML(b)}
    <div class="info">
      <p class="title">${esc(b.title)}</p>
      ${b.authors? `<p class="author">${esc(b.authors)}</p>`:''}
      ${b.publisher||b.published? `<p class="pub">${esc(b.publisher)}${b.published? ' / '+esc(b.published):''}</p>`:''}
      <div class="actions">
        <button class="pill want"    onclick='addBook("${enc}","want")'>＋ 読みたい</button>
        <button class="pill reading" onclick='addBook("${enc}","reading")'>＋ 読書中</button>
        <button class="pill done"    onclick='addBook("${enc}","done")'>＋ 読了</button>
      </div>
    </div>
  </div>`;
}

window.addBook = function(enc, status){
  const b = JSON.parse(decodeURIComponent(enc));
  if(books.some(x=>x.id===b.id)){ toast('すでに本棚にあります'); switchTab('shelf'); return; }
  books.unshift({
    ...b, status, rating:0, note:'',
    addedAt: Date.now(),
    finishedAt: status==='done'? Date.now() : null
  });
  save(); renderShelf();
  toast(status==='done'?'読了に追加しました 🎉':'本棚に追加しました');
  switchTab('shelf');
};

/* ============ 本棚UI ============ */
let filter = 'all';
const shelfList = document.getElementById('shelfList');

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  filter = btn.dataset.f;
  [...document.querySelectorAll('#filters button')].forEach(b=>b.classList.toggle('active', b===btn));
  renderShelf();
});

const STATUS_LABEL = {want:'読みたい', reading:'読書中', done:'読了'};

function renderStats(){
  const c = {want:0,reading:0,done:0};
  books.forEach(b=>c[b.status]!==undefined && c[b.status]++);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${c.want}</div><div class="l">読みたい</div></div>
    <div class="stat"><div class="n">${c.reading}</div><div class="l">読書中</div></div>
    <div class="stat"><div class="n">${c.done}</div><div class="l">読了</div></div>`;
}

function renderShelf(){
  renderStats();
  const list = books.filter(b=> filter==='all' || b.status===filter);
  if(!list.length){
    shelfList.innerHTML = `<div class="empty">${books.length? 'この条件の本はありません。':'まだ本がありません。<br>「本を追加」から登録してみましょう。'}</div>`;
    return;
  }
  shelfList.innerHTML = list.map(b=>{
    const stars = [1,2,3,4,5].map(n=>`<span class="${n<=b.rating?'on':''}" onclick='setRating("${b.id}",${n})'>★</span>`).join('');
    return `<div class="book">
      ${coverHTML(b)}
      <div class="info">
        <span class="status-tag ${b.status}">${STATUS_LABEL[b.status]}</span>
        <p class="title">${esc(b.title)}</p>
        ${b.authors? `<p class="author">${esc(b.authors)}</p>`:''}
        <div class="stars">${stars}</div>
        <textarea class="note" placeholder="メモ・感想…" onchange='setNote("${b.id}", this.value)'>${esc(b.note||'')}</textarea>
        <div class="row-actions">
          <select class="status-select" onchange='setStatus("${b.id}", this.value)'>
            <option value="want" ${b.status==='want'?'selected':''}>読みたい</option>
            <option value="reading" ${b.status==='reading'?'selected':''}>読書中</option>
            <option value="done" ${b.status==='done'?'selected':''}>読了</option>
          </select>
          <button class="mini del" onclick='delBook("${b.id}")'>削除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.setStatus = (id, st)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  b.status = st; if(st==='done' && !b.finishedAt) b.finishedAt = Date.now();
  save(); renderShelf();
};
window.setRating = (id, n)=>{
  const b = books.find(x=>x.id===id); if(!b) return;
  b.rating = (b.rating===n)? 0 : n; save(); renderShelf();
};
window.setNote = (id, v)=>{ const b = books.find(x=>x.id===id); if(b){ b.note=v; save(); } };
window.delBook = (id)=>{
  if(!confirm('この本を本棚から削除しますか？')) return;
  books = books.filter(x=>x.id!==id); save(); renderShelf(); toast('削除しました');
};

/* ============ タブ ============ */
function switchTab(name){
  [...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('panel-shelf').classList.toggle('active', name==='shelf');
  document.getElementById('panel-add').classList.toggle('active', name==='add');
}
document.querySelector('.tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(btn) switchTab(btn.dataset.tab);
});

/* ============ バーコードスキャン ============ */
let scanner = null;
const scanModal = document.getElementById('scanModal');

document.getElementById('scanBtn').onclick = startScan;
document.getElementById('closeScan').onclick = stopScan;

async function startScan(){
  scanModal.classList.add('open');
  document.getElementById('scanCap').textContent = 'カメラを起動しています…';
  scanner = new Html5Qrcode('reader', { formatsToSupport:[ Html5QrcodeSupportedFormats.EAN_13 ] });
  try{
    await scanner.start(
      { facingMode:'environment' },
      { fps:10, qrbox:{width:260, height:160} },
      onScan,
      ()=>{}
    );
    document.getElementById('scanCap').textContent = '本の裏のバーコード（978…）を枠に合わせてください';
  }catch(e){
    document.getElementById('scanCap').textContent = 'カメラを使用できませんでした。権限を許可するか、検索をご利用ください。';
  }
}

let scanLock = false;
async function onScan(text){
  if(scanLock) return;
  if(!/^97[89]/.test(text)) return; // 書籍ISBNのみ
  scanLock = true;
  document.getElementById('scanCap').textContent = '読み取りました：' + text + ' / 検索中…';
  await stopScan();
  switchTab('add');
  document.getElementById('q').value = text;
  resultsEl.innerHTML = '<div class="loading">書籍情報を取得中…</div>';
  try{
    const b = await lookupISBN(text);
    resultsEl.innerHTML = b ? cardHTML(b,true)
      : '<div class="empty">この本の情報が見つかりませんでした。タイトルで検索してみてください。</div>';
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">通信エラーが発生しました。</div>';
  }
  setTimeout(()=>scanLock=false, 800);
}

async function stopScan(){
  scanModal.classList.remove('open');
  if(scanner){
    try{ await scanner.stop(); scanner.clear(); }catch(e){}
    scanner = null;
  }
}

/* ============ バックアップ ============ */
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(books,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'books-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      const ids = new Set(books.map(b=>b.id));
      let added = 0;
      data.forEach(b=>{ if(b.id && !ids.has(b.id)){ books.push(b); ids.add(b.id); added++; } });
      save(); renderShelf();
      toast(added + '冊を読み込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  r.readAsText(file);
};

/* ============ ユーティリティ ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 初期描画 */
renderShelf();

/* Service Worker（オフライン対応・ホーム追加） */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
